services:
  postgres:
    image: postgres:16-alpine
    container_name: sectorsplit_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sectorsplit
      POSTGRES_PASSWORD: sectorsplit_dev
      POSTGRES_DB: sectorsplit
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
